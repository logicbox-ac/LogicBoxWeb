server {
    listen 80;
    server_name logicbox.one www.logicbox.one;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name logicbox.one www.logicbox.one;

    ssl_certificate /etc/letsencrypt/live/logicbox.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logicbox.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Entry bundles are not content-hashed (e.g. gui.js), so force revalidation
    # on every request to avoid serving stale code after deploys.
    location ~* ^/(?:gui|blocksonly|compatibilitytesting|player|extension-worker)\.js(?:\.map)?$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
