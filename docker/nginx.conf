server {
    listen 80;
    server_name logicbox.one www.logicbox.one;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    # Host Nginx proxies to this HTTP server on 8080. Keep compression and
    # cache behavior here so first-load JS transfer is smaller and repeat loads
    # use immutable hashed assets from browser cache.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/[^/]+\.[0-9a-f]+?\.(?:js|css)(?:\.map)?$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* ^/extension-worker\.js(?:\.map)?$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ^~ /chunks/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name logicbox.one www.logicbox.one;

    ssl_certificate /etc/letsencrypt/live/logicbox.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logicbox.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # The deployed app still has a large first-load JS bundle. Compress it in
    # transit so production startup cost is dominated less by network transfer.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML is always fresh, so any content-hashed assets it references at the
    # root can be cached aggressively between deploys.
    location ~* ^/[^/]+\.[0-9a-f]+?\.(?:js|css)(?:\.map)?$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # The extension worker keeps a fixed filename, so it still needs
    # revalidation after deploys.
    location ~* ^/extension-worker\.js(?:\.map)?$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ^~ /chunks/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }
}

# ============================================================
# api.logicbox.one — Backend API reverse proxy
# ============================================================

server {
    listen 80;
    server_name api.logicbox.one;
    client_max_body_size 100M;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.logicbox.one;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/api.logicbox.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.logicbox.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://172.17.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
